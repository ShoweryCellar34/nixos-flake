[audio]
enable_overdrive = true

[bar.main]
background_opacity = 1.0
center = [ "taskbar" ]
concave_edge_corners = false
contact_shadow = false
enabled = true
end = [ "tray", "Spacer", "notifications", "bluetooth", "network", "volume", "battery", "sysmon", "session" ]
margin_ends = 0
position = "top"
radius = 0
shadow = false
start = [ "recorder_3", "clock", "media", "workspaces", "privacy" ]

[battery]
warning_threshold = 25

[desktop_widgets]
enabled = false

[dock]
background_opacity = 1.0

[hooks]
logging_out = "uwsm app -- hyprshutdown --no-fork -t \"Logging Out...\""
rebooting = "uwsm app -- hyprshutdown --no-fork -t \"Rebooting...\""
shutting_down = "uwsm app -- hyprshutdown --no-fork -t \"Shutting Down...\""

[idle]
behavior_order = [ "lock", "screen-off" ]
pre_action_fade_seconds = 15

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[lockscreen]
fingerprint = false

[plugin_settings."noctalia/screen_recorder"]
color_range = "full"
directory = "~/videos/captures"
video_source = "focused"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
clipboard_auto_paste = "off"
clipboard_history_max_entries = 1000
external_ip_enabled = false
launch_apps_custom_command = "uwsm app -- $CMD"
password_style = "random"
polkit_agent = true
time_format = "{:%H:%M:%S}"

    [shell.animation]
    enabled = false

    [shell.launcher]
    compact = true

    [shell.panel]
    list_item_background = true
    transparency_mode = "solid"

    [shell.screenshot]
    directory = "~/pictures/screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "secondary"

    [[shell.session.actions]]
    action = "command"
    command = 'systemctl hibernate'
    countdown_seconds = 0.0
    enabled = true
    glyph = "hibernate"
    label = "Hibernate"
    shortcut = "3"
    variant = "primary"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "destructive"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [shell.shadow]
    alpha = 0.0

[system.monitor]
cpu_poll_seconds = 1
cpu_temp_activity_threshold = 70
cpu_temp_critical_threshold = 90
cpu_usage_activity_threshold = 60
disk_free_activity_threshold = 75
disk_free_critical_threshold = 90
disk_free_pct_activity_threshold = 75
disk_free_pct_critical_threshold = 90
disk_poll_seconds = 2
disk_used_activity_threshold = 75
disk_used_critical_threshold = 90
disk_used_pct_activity_threshold = 75
disk_used_pct_critical_threshold = 90
gpu_poll_seconds = 1
gpu_vram_activity_threshold = 60
memory_poll_seconds = 1
network_poll_seconds = 1

[widget.Spacer]
length = 16
type = "spacer"

[widget.clock]
format = "%d/%m/%Y %H:%M:%S"

[widget.media]
max_length = 180
min_length = 60
show_progress = true

[widget.network]
show_vpn_label = true

[widget.recorder_3]
type = "noctalia/screen_recorder:recorder"

[widget.sysmon]
show_value = false
stat = "ram_pct"
visualization = "none"

[widget.taskbar]
pinned = [
    "dev.noctalia.Noctalia",
    "alacritty",
    "thunar",
    "keepassxc",
    "spotify",
    "code",
    "steam",
    "vesktop",
    "whatsapp",
    "firefox"
]
pinned_opacity = 0.7
scale = 1.25

[widget.tray]
detached_panel = true
drawer = true
drawer_columns = 4

[widget.workspaces]
active_pill_size = 2.0
pill_scale = 0.9
